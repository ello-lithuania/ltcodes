name: Clojure
on:
  push:
    paths: ["clojure/**", "test_vectors.json", ".github/workflows/clojure.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish net.clojars.ellolt/ltcodes to Clojars
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clojure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
      - run: clojure -X:test
      - run: clojure -T:build jar
      - run: unzip -l target/ltcodes-*.jar && unzip -p target/ltcodes-*.jar META-INF/maven/net.clojars.ellolt/ltcodes/pom.xml
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clojure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
      - run: clojure -T:build deploy
        env:
          CLOJARS_USERNAME: ellolt
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
